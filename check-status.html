<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Status | UpdateSys</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="status">

<header class="navbar">
    <div class="container nav-inner">
        <a class="brand" href="index.html">
            <img class="logo" src="images/logo.jpg" alt="Update Salon Logo">
            <span>Update Salon <small>by Josie</small></span>
        </a>

        <button class="menu-toggle" onclick="toggleMenu()">☰</button>

        <nav class="nav-links" id="mainNav">
            <a href="index.html" data-page="home">Home</a>
            <a href="services.html" data-page="services">Services</a>
            <a href="booking.html" data-page="booking">Book Appointment</a>
            <a href="check-status.html" data-page="status">Check Status</a>
            <a href="contact.html" data-page="contact">Contact Us</a>
            <a class="admin-mobile" href="admin-login.html">Admin Portal</a>
        </nav>

        <div class="nav-actions">
            <a class="btn btn-light" href="admin-login.html">Admin Portal</a>
        </div>
    </div>
</header>


<section class="page-header clean-page-header">
    <div class="container">
        <h1>Checking Status</h1>
        <p class="page-instruction">Enter your full name and 11-digit contact number to view your appointment status.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <form class="card status-check-form" id="customerStatusForm" autocomplete="off">
            <div class="form-grid">
                <div class="form-group">
                    <label for="statusCustomerName">Full Name</label>
                    <input type="text" id="statusCustomerName" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="statusContactNumber">Contact Number</label>
                    <input type="tel" id="statusContactNumber" required maxlength="11" pattern="[0-9]{11}" placeholder="11-digit contact number" inputmode="numeric">
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Check My Appointment</button>
        </form>

        <div id="customerStatusResult" class="status-result"></div>
    </div>
</section>


<footer class="footer">
    <div class="container footer-simple">
        <p>Update Salon by Josie &copy; 2026 | Maunlad Mall 1 Extension, Malolos | 8:00 AM - 5:00 PM</p>
    </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
